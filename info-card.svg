<svg xmlns="http://www.w3.org/2000/svg" width="490" height="220" viewBox="0 0 490 220">
  <rect width="490" height="220" fill="#0d1117" rx="8"/>
  <style>

    .card {
        font-family: Consolas, monospace;
        font-size: 14px;
        fill: #ffffff;
    }
    .title {
        font-weight: bold;
        fill: #58a6ff;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(8px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    .anim {
        opacity: 0;
        animation: slideIn 0.4s forwards;
    }
  </style>
  <text x="20" y="40" class="card title anim" style="animation-delay: 0.5s;">aamir@github</text>
  <text x="20" y="55" class="card anim" style="animation-delay: 0.8s;">------------</text>
  <text x="20" y="80" class="card anim" style="animation-delay: 1.1s;"><tspan fill="#f97583" font-weight="bold">Role</tspan>: Cloud &amp; AI Infrastructure Enthusiast</text>
  <text x="20" y="105" class="card anim" style="animation-delay: 1.4000000000000001s;"><tspan fill="#79c0ff" font-weight="bold">Focus</tspan>: Agentic AI + Cloud-Native Systems</text>
  <text x="20" y="130" class="card anim" style="animation-delay: 1.7000000000000002s;"><tspan fill="#56d364" font-weight="bold">Stack</tspan>: Python · AWS · GCP · LangChain · Docker</text>
  <text x="20" y="155" class="card anim" style="animation-delay: 2.0s;"><tspan fill="#d2a8ff" font-weight="bold">OS</tspan>: Linux / macOS</text>
  <text x="20" y="180" class="card anim" style="animation-delay: 2.3s;"><tspan fill="#e3b341" font-weight="bold">Editor</tspan>: VS Code</text>
</svg>